name: CI

on: # main에 변경 사항이 있을 때
  push: # 코드가 저장소로 푸시될 때
    branches:
      - main
  pull_request:
    branches:
      - main

# 동시 요청 방지
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 백엔드 변경분에 대해서만 CI를 수행
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # 저장소 내용을 체크아웃
      - uses: actions/checkout@v4
      # backend 또는 workflow 파일 변경 여부를 필터링
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' # 코드 변경 있어야 진행
    runs-on: ubuntu-latest
    steps:
      # 테스트 실행을 위해 저장소 코드를 가져온다.
      - uses: actions/checkout@v4

      # Maven 테스트 실행용 JDK 25와 의존성 캐시를 준비한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      # 추가 프로필 없이 기본 설정으로 테스트 실행 (통합테스트도 함께 진행)
      - name: Run backend tests (unit + integration)
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  # 실제 배포 이미지가 빌드되는지 PR 단계에서 미리 확인 (push는 안함)
  # 중요 - cd.yml의 빌드 스텝과 컨텍스트/Dockerfile 경로를 반드시 일치 시키기
  backend-image-build:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      # Docker 빌드 컨텍스트로 사용할 소스 코드를 가져오기
      - uses: actions/checkout@v4
      # BuildKit 기반 이미지 빌드를 위해 buildx를 활성화
      - uses: docker/setup-buildx-action@v3
      # 실제 배포와 같은 Dockerfile로 이미지가 빌드되는지 검증
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
